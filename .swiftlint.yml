# ============================================================================
# Excluded Paths
# ============================================================================
# Keep SwiftLint off generated code, build artifacts, dependencies, and any
# nested git worktrees (e.g. .claude/worktrees/*) that would otherwise cause
# every source file to be linted twice and let generated files fail the build.
excluded:
  - DerivedData
  - build
  - release
  - .build
  - .claude
  - vendor
  - Pods
  - Carthage

# ============================================================================
# Enabled Rules (Alphabetically Sorted)
# ============================================================================
only_rules:
- async_without_await
- block_based_kvo
- class_delegate_protocol
- closing_brace
- collection_alignment
- colon
- comma
- comment_spacing
- compiler_protocol_init
- computed_accessors_order
- contains_over_filter_count
- contains_over_filter_is_empty
- contains_over_first_not_nil
- control_statement
- cyclomatic_complexity
- deployment_target
- discouraged_direct_init
- discouraged_optional_boolean
- duplicate_enum_cases
- duplicate_imports
- duplicated_key_in_dictionary_literal
- dynamic_inline
- empty_collection_literal
- empty_count
- empty_enum_arguments
- empty_parameters
- empty_parentheses_with_trailing_closure
- empty_xctest_method
- enum_case_associated_values_count
- explicit_init
- fatal_error_message
- file_length
- for_where
- force_cast
- force_try
- function_body_length
- function_name_whitespace
- function_parameter_count
- generic_type_name
- identifier_name
- implicit_getter
- implicit_optional_initialization
- is_disjoint
- joined_default_parameter
- large_tuple
- last_where
- leading_whitespace
- legacy_cggeometry_functions
